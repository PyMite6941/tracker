<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t">
  <title id="t">tracker</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16202e"/>
      <stop offset="1" stop-color="#0b1119"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- resume arc: a loop that returns to where you left off -->
  <path d="M95 46 A36 36 0 1 0 98 78" fill="none" stroke="url(#arc)" stroke-width="9" stroke-linecap="round"/>
  <path d="M84 40 L99 44 L95 59" fill="none" stroke="#5eead4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- session track: three sessions on a timeline, the newest lit -->
  <line x1="44" y1="64" x2="80" y2="64" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <circle cx="44" cy="64" r="5" fill="#475569"/>
  <circle cx="60" cy="64" r="5" fill="#64748b"/>
  <circle cx="78" cy="64" r="8" fill="#f8fafc"/>
  <circle cx="78" cy="64" r="3.5" fill="#0b1119"/>
</svg>
